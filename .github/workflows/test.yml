# This repository mirrors the released client; changes are made upstream and copied here at each
# release. The tests use a local fake API, so they need no key and make no network calls.
name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest "cryptography>=42"
      - run: pytest -q tests
