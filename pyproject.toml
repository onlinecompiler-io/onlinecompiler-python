[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onlinecompiler"
dynamic = ["version"]
description = "Python client for the OnlineCompiler.io code execution API: run and judge code in 46 languages in a sandbox"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RunCode Inc." }]
keywords = ["code execution", "online compiler", "compiler api", "judge0", "online judge", "sandbox", "onlinecompiler", "code judge", "webhooks", "signed receipts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Compilers",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Ed25519 for verify_receipt; everything else uses the standard library.
receipts = ["cryptography>=42"]

[project.urls]
Homepage = "https://onlinecompiler.io"
Documentation = "https://onlinecompiler.io/docs"
Pricing = "https://onlinecompiler.io/pricing"
Changelog = "https://onlinecompiler.io/changelog"
Source = "https://github.com/onlinecompiler-io/onlinecompiler-python"
Issues = "https://github.com/onlinecompiler-io/onlinecompiler-python/issues"

[tool.hatch.version]
path = "src/onlinecompiler/_client.py"

[tool.hatch.build.targets.wheel]
packages = ["src/onlinecompiler"]
